# Standalone stack: never combine this file with docker-compose.yaml.
name: docmind-auth-e2e
services:
  mongodb:
    image: mongo:8
    tmpfs:
      - /data/db
      - /data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 30
  auth-service:
    build: ./auth-service
    environment:
      NODE_ENV: test
      PORT: "3001"
      MONGO_URI: mongodb://mongodb:27017/docmind_auth_e2e
      JWT_ACCESS_SECRET: docmind-isolated-e2e-signing-key-not-for-production
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
  document-service:
    build: ./document-service
    environment:
      NODE_ENV: test
      PORT: "3002"
      MONGO_URI: mongodb://mongodb:27017/docmind_documents_e2e
      JWT_ACCESS_SECRET: docmind-isolated-e2e-signing-key-not-for-production
      CHATBOT_SERVICE_URL: http://chatbot-service:3003
      PDF_STORAGE_DIR: /data/pdfs
    volumes:
      - e2e_pdfs:/data/pdfs
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
  chatbot-service:
    build: ./chatbot-service
    command: ["uvicorn", "tests.provider_fixture:app", "--host", "0.0.0.0", "--port", "3003"]
    volumes:
      - ./chatbot-service/tests:/app/tests:ro
    environment:
      MONGO_URI: mongodb://mongodb:27017/docmind_documents_e2e
      DOCUMENT_SERVICE_URL: http://document-service:3002
    depends_on:
      document-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3003/health')"]
      interval: 2s
      timeout: 5s
      retries: 30
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      auth-service:
        condition: service_healthy
      document-service:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 2s
      timeout: 5s
      retries: 30
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.e2e
    ports:
      - "127.0.0.1:4173:4173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  e2e_pdfs:

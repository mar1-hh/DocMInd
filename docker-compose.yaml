services:
  mongodb:
    image: mongo:8
    container_name: docmind-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db

  auth-service:
    build: ./auth-service
    container_name: docmind-auth
    restart: unless-stopped
    env_file:
      - ./auth-service/.env
    environment:
      MONGO_URI: mongodb://mongodb:27017/docmind_auth
    depends_on:
      - mongodb

  nginx:
    image: nginx:alpine
    container_name: docmind-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  mongodb_data:
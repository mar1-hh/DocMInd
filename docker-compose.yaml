services:
  mongodb:
    image: mongo:8
    container_name: docmind-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db

  auth-service:
    build: ./auth-service
    container_name: docmind-auth
    restart: unless-stopped
    env_file:
      - ./auth-service/.env
    environment:
      MONGO_URI: mongodb://mongodb:27017/docmind_auth
      PORT: "3001"
    depends_on:
      - mongodb

  document-service:
    build: ./document-service
    restart: unless-stopped
    env_file:
      - ./auth-service/.env
    environment:
      MONGO_URI: mongodb://mongodb:27017/docmind_documents
      PORT: "3002"
      CHATBOT_SERVICE_URL: http://chatbot-service:3003
      PDF_STORAGE_DIR: /data/pdfs
    volumes:
      - document_pdfs:/data/pdfs
    depends_on:
      - mongodb

  chatbot-service:
    build: ./chatbot-service
    restart: unless-stopped
    env_file:
      - path: ./chatbot-service/.env
        required: false
    environment:
      MONGO_URI: mongodb://mongodb:27017/docmind_documents
      DOCUMENT_SERVICE_URL: http://document-service:3002
    depends_on:
      - document-service

  nginx:
    image: nginx:alpine
    container_name: docmind-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - document-service
      - frontend
      - chatbot-service
  
  frontend:
    build: ./frontend
    container_name: docmind-frontend
    restart: unless-stopped
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public

volumes:
  mongodb_data:
  document_pdfs:

events {}

http {
    # Refresh upstream addresses when Compose replaces a container.
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream frontend_app {
        zone frontend_app 64k;
        server frontend:5173 resolve;
    }

    upstream auth_api {
        zone auth_api 64k;
        server auth-service:3001 resolve;
    }

    upstream documents_api {
        zone documents_api 64k;
        server document-service:3002 resolve;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;

        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Forwarded "";

        location /api/auth/ {
            proxy_pass http://auth_api;
        }

        location ~ ^/api/collections(/|$) {
            proxy_pass http://documents_api;
        }

        location = /health/documents {
            proxy_pass http://documents_api/health;
        }

        location /health {
            proxy_pass http://auth_api;
        }

        location / {
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
